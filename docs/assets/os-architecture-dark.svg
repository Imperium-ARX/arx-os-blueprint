<svg xmlns="http://www.w3.org/2000/svg" viewBox="-443.63 -271.08 1133.5 554.03" width="100%" role="img" aria-labelledby="os-architecture-t os-architecture-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="os-architecture-t">You, the brain, and the five organs: context, memory, skills, connectors, self-maintenance</title><desc id="os-architecture-d">A person at a desk on the left, the brain in the centre as a stack of planes, and five platforms in an arc to the right: a document stack for context, a filing cabinet for memory, a toolbox for skills, two joined boxes for connectors, a gauge for self-maintenance. You ask, it ships.</desc>
