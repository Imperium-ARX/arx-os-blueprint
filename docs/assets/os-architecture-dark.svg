ht="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">CONTEXT</text><text x="380.87106997798077" y="-186" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="380.87106997798077" dy="0">the one-page truth about your</tspan><tspan x="380.87106997798077" dy="14.950000000000001">company, read every session</tspan></text><text x="445.87106997798077" y="-102" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">MEMORY</text><text x="445.87106997798077" y="-86" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="445.87106997798077" dy="0">people, decisions, tasks, dates,</tspan><tspan x="445.87106997798077" dy="14.950000000000001">filed the moment you say them</tspan></text><text x="465.87106997798077" y="-2" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">SKILLS</text><text x="465.87106997798077" y="14" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="465.87106997798077" dy="0">pre-built workflows, quality</tspan><tspan x="465.87106997798077" dy="14.950000000000001">enforcement, guardrails</tspan></text><text x="445.87106997798077" y="98" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">CONNECTORS</text><text x="445.87106997798077" y="114" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="445.87106997798077" dy="0">GitHub backup, Google Workspace,</tspan><tspan x="445.87106997798077" dy="14.950000000000001">research, notifications</tspan></text><text x="380.87106997798077" y="198" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">SELF-MAINTENANCE</text><text x="380.87106997798077" y="214" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="380.87106997798077" dy="0">a registry and lint that catch</tspan><tspan x="380.87106997798077" dy="14.950000000000001">drift before you do</tspan></text>
