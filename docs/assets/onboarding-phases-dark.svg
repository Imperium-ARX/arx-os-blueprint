<svg xmlns="http://www.w3.org/2000/svg" viewBox="-165.87 -611 808.62 1165" width="100%" role="img" aria-labelledby="onboarding-phases-t onboarding-phases-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="onboarding-phases-t">The eight onboarding phases: welcome, identity, business, voice, connections, first skills, cadence, graduation</title><desc id="onboarding-phases-d">Eight rising treads along one staircase. A figure stands at the foot. Each tread has a leader to its phase number and name and a short line under it: welcome (the tour), identity (plus privacy list), business (7-question interview), voice (sounds like you), connections (verified one by one), first skills (run for real), cadence (memory seeded), graduation (health baseline). The top tread, graduation, is the highlighted one.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#f4f1ea" stroke-width="1.2" stroke-linejoin="round"/></marker>
