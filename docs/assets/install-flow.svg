family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle"><tspan x="98.73" dy="0">one at a time,</tspan><tspan x="98.73" dy="14.950000000000001">each one verified</tspan></text><text x="296.18" y="81.55706345359769" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#15130e" text-anchor="middle" letter-spacing="1.4">5  FIRST SKILLS, LIVE</text><text x="296.18" y="97.55706345359769" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle"><tspan x="296.18" dy="0">3 to 5 weekly tasks,</tspan><tspan x="296.18" dy="14.950000000000001">each run for real</tspan></text><text x="493.63" y="81.55706345359769" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#15130e" text-anchor="middle" letter-spacing="1.4">6  IT COMPOUNDS</text><text x="493.63" y="97.55706345359769" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle">sharper every week</text><text x="0" y="153.5570634535977" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle">about an hour of your attention, in chunks. Stop anytime, resume with "continue onboarding"</text>
